<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TocaEssaApp - apresentações e conexão entre artistas e público">
  <meta name="theme-color" content="#A855F7">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TocaEssa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TocaEssa</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fundo do tema já no carregamento: sem ele, a tela fica branca até o
       Flutter abrir, o que demora com a internet fraca de um show. -->
  <style>
    html, body { margin: 0; background-color: #0B080F; }
    #carregando-toca-essa {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; padding: 24px;
      text-align: center; font-family: system-ui, sans-serif; color: #C8C2D0;
    }
    #carregando-toca-essa b { font-size: 18px; color: #FFFFFF; font-weight: 600; }
    #carregando-toca-essa .roda {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #34303E; border-top-color: #B781FF;
      animation: gira 0.9s linear infinite;
    }
    @keyframes gira { to { transform: rotate(360deg); } }
    /* O editor de cifra usa um campo do navegador por baixo do Flutter, e no
       iPhone é ele que põe o cursor: com a mesma fonte, o toque cai na letra
       certa. */
    @font-face {
      font-family: 'JetBrainsMono';
      src: url('assets/assets/fontes/JetBrainsMono.ttf') format('truetype');
      font-display: swap;
    }
  </style>
</head>
<body>
  <!-- Enquanto o Flutter carrega (e o servidor acorda, se estava dormindo). -->
  <div id="carregando-toca-essa">
    <div class="roda"></div>
    <b>Carregando o aplicativo TocaEssa, aguarde…</b>
    <span>Na primeira vez do dia pode levar até 1 minuto.</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var aviso = document.getElementById('carregando-toca-essa');
      if (aviso) aviso.remove();
    });
  </script>
  <!-- Chrome e Android avisam que dá para instalar antes de o Flutter abrir:
       o pedido fica guardado para o "Instalar no celular" dos perfis. -->
  <script>
    window.addEventListener('beforeinstallprompt', function (evento) {
      evento.preventDefault();
      window.pedidoDeInstalacaoDoTocaEssa = evento;
    });
    window.addEventListener('appinstalled', function () {
      window.pedidoDeInstalacaoDoTocaEssa = null;
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
